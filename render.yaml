services:
  - type: web
    name: agent-garden-chat
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AUTH0_ISSUER_BASE_URL
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_SECRET
        sync: false
      - key: AUTH0_BASE_URL
        value: https://agent-garden-chat.onrender.com
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: D1_WORKER_URL
        sync: false
      - key: D1_WORKER_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://agent-garden-chat.onrender.com
      - key: E2B_ALLOW_INTERNET
        value: "true"
      - key: STORAGE_PROVIDER
        value: tigris
      - key: TIGRIS_BUCKET_NAME
        sync: false
      - key: TIGRIS_ENDPOINT
        value: https://t3.storage.dev
      - key: TIGRIS_REGION
        value: auto
      - key: TIGRIS_ACCESS_KEY_ID
        sync: false
      - key: TIGRIS_SECRET_ACCESS_KEY
        sync: false
